version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-run
    ports:
      - "8000:8000"
    volumes:
      - ./preprocessing/processed:/app/preprocessing/processed:ro
      - ./backend/app/data:/app/backend/app/data:ro
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-run
    ports:
      - "4173:4173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
